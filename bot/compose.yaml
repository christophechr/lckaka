name: lckaka-bot

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lck_bot
      POSTGRES_USER: lck_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lck_bot -d lck_bot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    image: ${APP_IMAGE:-ghcr.io/christophechr/lckaka-bot:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Paris
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 20s

volumes:
  postgres_data:
    # Nom fixe : indépendant du dossier ou du nom de projet Compose.
    name: lckaka-bot-postgres-data
